# ===== 外部覆盖配置(优先于 jar 内置默认值,修改后无需重新打包) =====
# 只需取消注释要改的项

# 内网 Ollama 服务器地址(改成你的服务器 IP/端口)
agent.model.base-url=http://192.168.0.235:11435

# 使用的模型:需支持工具调用(tools),且已在该服务器上 ollama pull
# 正规 agent 流程依赖模型真正发起 tool call(如按需 read_document 读参考文档),
# qwen2.5:7b 实测会把调用当文本输出,故切到 qwen3(原生工具调用可靠)
agent.model=ollama:qwen3:14b

# ---- 其它可调项(默认值见 src/main/resources/application.properties) ----
# agent.temperature=0.7
# agent.mcp.filesystem.env=npm_config_registry=https://registry.npmmirror.com

# ---- MCP 服务列表(全局定义一次,各 agent 默认继承) ----
# filesystem:本地工作区文件读写(stdio,由 npx 拉起)
# agent-mcp:独立 Spring Boot 服务(agent-mcp 目录,端口 8082,Streamable HTTP)
agent.mcp.servers=filesystem;agent-mcp

# 独立 MCP 服务:数据库只读查询 + Qdrant 向量库
# 需先启动:cd agent-mcp && mvn spring-boot:run(或 java -jar target/agent-mcp.jar)
# 工具在 agent 侧注册名即原名,如 db_query / qdrant_search
agent.mcp.agent-mcp.transport=http
agent.mcp.agent-mcp.url=http://localhost:8082/mcp
agent.mcp.agent-mcp.timeout-seconds=60
agent.mcp.agent-mcp.init-timeout-seconds=30

# ---- 工具权限(HITL) ----
# 工具调用是否需要人工确认。可选值:
#   default       按工具自身规则判定,未命中的一律询问用户(会卡住等确认)
#   accept_edits  自动放行"工作目录内的只读/编辑"操作;对 MCP 写工具无效
#   explore       只允许只读探索
#   bypass        全部自动放行,不再询问(本机沙箱环境推荐)
#   dont_ask      需要询问时直接拒绝,不挂起等待
agent.permission-mode=bypass

# ---- 技能(Skill) ----
# 全局技能目录:新建的 agent 默认继承它
agent.skills-dir=skills
# default 不加载技能:实测 qwen3:14b 在第二轮起会被 SKILL.md 正文里的"步骤"带偏
# (问快递却先调 list_context_files 或 query_weather)。技能内容已收敛进工具 description
# 和系统提示词。将来要做周报等专用 agent,给它单独配 skills-dir=skills 即可。
agent.default.skills-dir=skills-disabled

# ---- HTTP 接口鉴权 ----
# 调用 /api/* 需带请求头 X-API-Key(服务重启后生效);留空=不鉴权
agent.api.key=change-me
# 单次对话超时(秒)
# agent.request-timeout-seconds=300

# ---- 民生查询 API Key(填在这里即可生效,无需重新打包) ----
# 天气(和风天气): 控制台「设置-凭证」获取 API Key 与专属 Host
agent.qweather.key=282d294367c7461aaf8ec045a5a34e1a
# 专属 API Host(控制台同页,形如 abc123.qweatherapi.com;新版账户必填,旧版 key 可留空)
agent.qweather.api-host=np6aq2qjqu.re.qweatherapi.com
# 快递(万维易源 ShowAPI 新版接口 64-19): https://www.showapi.com 开通套餐后,
# 控制台"我的套餐/免费额度"页获取 appKey 即可,无需 appsecret/签名
agent.showapi.appkey=E6D827483ad4462Aa795C1218704c301

# ---- 多 Agent(零代码新增) ----
# 在 list 里加名字即可,接口自动出现 /api/agents/<名>/chat;
