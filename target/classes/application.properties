# ===== AgentScope Java Agent 服务默认配置 =====
# 说明:
#   - agent.* 业务配置由程序读取,同目录外部 agent.properties 会覆盖这里(改配置无需重新打包)
#   - server.* / spring.* / logging.* 是 Spring Boot 框架配置,仅本文件生效

# ---- HTTP 服务 ----
# 端口需与前端 agent-vue/vite.config.js 的 proxy target(http://localhost:8080)保持一致
server.port=8080
spring.application.name=agentscope-agent-server
# JDK21 虚拟线程:agent 调用多为阻塞等待,虚拟线程可支撑大量并发会话
spring.threads.virtual.enabled=true
# 流式(SSE)异步请求兜底超时(毫秒),单次对话超时另由 agent.request-timeout-seconds 控制
spring.mvc.async.request-timeout=600000

# ---- 文件上传(参考文档 context 目录) ----
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
# 参考文档注入策略:每轮对话前向消息注入的内容。
# <=0(默认,正规 agent 流程):只注入轻量文档目录(文件名/大小),正文由模型自己调用
#   list_context_files / read_document 按需获取,最省上下文,要求模型能可靠发起 tool call。
# >0 (弱模型兜底):由服务端直接把不超过该字符数的文档正文注入消息,适合把工具调用
#   当文本输出、不会真正发起 tool call 的小模型(如 qwen2.5:7b)。
# 同一批文档(内容指纹一致)在同一会话内只注入一次;文档增删改后自动重新注入。
# 单个 agent 可用 agent.<名>.context-inline-chars 覆盖。
agent.context-inline-chars=0

# ---- 日志(控制台 + 滚动文件) ----
logging.file.name=logs/agent.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14

# ---- 鉴权与超时 ----
# 调用 /api/* 需携带请求头 X-API-Key;留空=不鉴权(仅建议可信内网)
agent.api.key=
# 单次对话请求超时(秒),同步接口超时返回 504
agent.request-timeout-seconds=300

# ---- 模型(全局默认,单个 agent 可用 agent.<名>.model 等覆盖) ----
# 模型: <provider>:<model>
#   ollama  -> 本地 Ollama, 需带 tools 能力的模型, 如 qwen3:4b / llama3.1
#   换 openai 兼容服务: 在 pom.xml 引入 agentscope-extensions-model-openai 后改为 openai:gpt-4o-mini 等
agent.model=ollama:qwen3:4b
agent.temperature=0.7
agent.max-iters=10

# ---- 工具权限(HITL) ----
# default / accept_edits / explore / bypass / dont_ask
# bypass = 工具调用全部自动放行,不挂起等待人工确认;accept_edits 对 MCP 写工具无效
agent.permission-mode=bypass

# ---- 民生查询 API Key(天气/快递工具,留空=工具返回配置提示,不影响其它功能) ----
# 和风天气 Key: 控制台「设置-凭证」获取
agent.qweather.key=
# 专属 API Host(控制台同页显示,形如 abc123.qweatherapi.com;留空回退 devapi.qweather.com,旧版 key 用)
agent.qweather.api-host=
# 万维易源(ShowAPI)快递查询新版接口(64-19): https://www.showapi.com 开通套餐后,
# 在控制台"我的套餐/免费额度"页获取 appKey 即可直调,无需 appsecret、无需签名
agent.showapi.appkey=

# 模型服务地址(可选):留空则用 provider 默认(Ollama 读环境变量 OLLAMA_BASE_URL,否则 localhost:11434)
# 内网 Ollama 示例: agent.model.base-url=http://192.168.1.100:11434
# 该配置对 openai/dashscope 等扩展 provider 同样生效
agent.model.base-url=

# ---- 目录(default agent 用这些全局目录;其它 agent 自动派生平行目录,见下方多 agent 说明) ----
# 会话状态目录(跨进程续聊), 可替换为 Redis/MySQL 存储
agent.session-dir=.agentscope/sessions
# 技能目录: <skill名>/SKILL.md
agent.skills-dir=skills
# 工作区: 文件系统 MCP 的根目录
agent.workspace-dir=workspace

# ---- MCP(全局只定义一次,各 agent 通过 agent.<名>.mcp-servers 按名选用) ----
agent.mcp.enabled=true
# server 名列表, 分号分隔; 新增 server 只需再加一段配置
agent.mcp.servers=filesystem

# stdio: 本地进程; command/args 中的 {workspace} 会按各 agent 的工作区替换
# (Windows 下 npx/node 等命令由程序自动用 cmd.exe /c 包装)
agent.mcp.filesystem.transport=stdio
agent.mcp.filesystem.command=npx
agent.mcp.filesystem.args=-y;@modelcontextprotocol/server-filesystem;{workspace}
# 工具调用超时 / 握手超时(首次 npx 下载包较慢,握手超时放宽)
agent.mcp.filesystem.timeout-seconds=120
agent.mcp.filesystem.init-timeout-seconds=300
# stdio 子进程环境变量,分号分隔 KEY=VALUE;这里让 npx 走国内镜像加速首次下载
agent.mcp.filesystem.env=npm_config_registry=https://registry.npmmirror.com

# 远程 MCP 示例(SSE / Streamable HTTP), 配置 url 即可启用:
# agent.mcp.servers=filesystem;remote-search
# agent.mcp.remote-search.transport=sse
# agent.mcp.remote-search.url=https://example.com/sse

# ---- 多 Agent 注册表 ----
# agent 名列表;接口路径 /api/agents/<名>/chat。未列出的 agent 不存在
agent.list=default

# 新增一个 agent 示例(零代码):在外部 agent.properties 里写——
# agent.list=default;report-writer
# agent.report-writer.sys-prompt=你是周报撰写助手。工作区: {workspace}
# agent.report-writer.model=ollama:qwen2.5:7b      # 省略则继承 agent.model
# agent.report-writer.base-url=                    # 省略则继承 agent.model.base-url
# agent.report-writer.temperature=0.5              # 省略则继承全局
# agent.report-writer.max-iters=8                  # 省略则继承全局
# agent.report-writer.skills-dir=skills            # 省略则共享全局技能目录
# agent.report-writer.mcp-servers=filesystem       # 省略则继承 agent.mcp.servers;置空=不接 MCP
# 目录约定:名为 default 的 agent 用上面的全局目录;其它 agent 自动使用
# 平行目录 workspace-<名> / sessions-<名>,文件与记忆互相隔离
