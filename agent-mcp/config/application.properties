# ===== 本机外部配置(优先于 jar 内置 application.properties,改完重启即生效) =====
# Spring Boot 会自动读取工作目录下的 config/application.properties

# ---- 数据库(MySQL / PostgreSQL 二选一,靠 url 区分) ----
# MySQL:
#   mcp.db.url=jdbc:mysql://localhost:3306/demo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
# PostgreSQL:
#   mcp.db.url=jdbc:postgresql://localhost:5432/demo
mcp.db.url=jdbc:mysql://192.168.0.100:3306/panjin_bds?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
mcp.db.username=root
mcp.db.password=root
# 留空则由 DriverManager 按 url 自动选择驱动
mcp.db.driver-class-name=

# ---- Qdrant ----
mcp.qdrant.base-url=http://192.168.0.235:6333
mcp.qdrant.api-key=