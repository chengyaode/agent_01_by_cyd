# ===== agent-mcp:独立 MCP 服务(默认 8082) =====
server.port=8082
spring.application.name=agent-mcp
# SSE 长连接需要放开异步超时
spring.mvc.async.request-timeout=600000

logging.file.name=logs/agent-mcp.log

# ---- MCP 端点 ----
# agent 侧对应配置:
#   agent.mcp.agent-mcp.transport=http
#   agent.mcp.agent-mcp.url=http://localhost:8082/mcp
mcp.name=agent-mcp
mcp.endpoint=/mcp

# ---- 数据库(MySQL / PostgreSQL 选一个填,靠 url 区分) ----
# MySQL 示例:
#   mcp.db.url=jdbc:mysql://localhost:3306/demo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
#   mcp.db.driver-class-name=com.mysql.cj.jdbc.Driver
# PostgreSQL 示例:
#   mcp.db.url=jdbc:postgresql://localhost:5432/demo
#   mcp.db.driver-class-name=org.postgresql.Driver
mcp.db.url=
mcp.db.username=
mcp.db.password=
# 可省略(留空由 DriverManager 按 url 自动选择驱动)
mcp.db.driver-class-name=
# 单条查询超时(秒)
mcp.db.query-timeout-seconds=15
# 单次返回行数上限(防止把整表塞进模型上下文)
mcp.db.max-rows=200

# ---- Qdrant ----
mcp.qdrant.base-url=http://localhost:6333
# Qdrant Cloud / 开启鉴权时填写
mcp.qdrant.api-key=
mcp.qdrant.timeout-seconds=20